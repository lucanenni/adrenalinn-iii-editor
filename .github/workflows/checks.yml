name: Checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Syntax-check every src/**/*.js module
        run: |
          for f in $(find src -name '*.js'); do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Syntax-check the inline <script type="module"> in each entry point
        run: node test/check-html-scripts.mjs

      - name: Service Worker precache list matches the files on disk
        run: node test/check-precache.mjs

      - name: Data round-trip self-test (presetData.js / drumbeatData.js / systemData.js / SysEx framing)
        run: node test/run.mjs

      - name: Device behaviour tests against the fake pedal (write sessions, resync, Factory Init…)
        run: node test/device.mjs
